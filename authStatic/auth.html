<script>
    async function add_user() {
        const input1 = document.getElementById("userName")
        const userName = input1.value

        const input2 = document.getElementById("pass")
        const pass = input2.value

        await fetch("/api/add_user", {
		    method: "POST",
		    headers: {'Content-Type': 'application/json'},  // так как мы шлём json, нужно явно это показать

            body: JSON.stringify({
                userName: userName,
                pass: pass
            }),
        })

        location.reload();
    }
