<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <p>Авторизация</p>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxlFCXTU1vPdkR0G7B_Ur8VRWUSg73w8cT9A&s" alt="Котик" width="200">
<div>

    <input id="user_name" placeholder="имя пользователя">
    <input id="user_pass" placeholder="пароль">\
    <button id="aft">авторизоваться</button>
    <button id="reg">зарегистрироваться</button>

</div>
    <script>
    async function create_user() {
        const input1 = document.getElementById("user_name")
        const user_name = input1.value
        const input2 = document.getElementById("user_pass")
        const user_pass = input2.value
        await fetch("/api/add_user", {
            method: "POST",
            headers: {'Content-Type': 'application/json'},  // так как мы шлём json, нужно явно это показать
            body: JSON.stringify({
                name: user_name,
                passw: user_pass,
            }),
        })

        location.reload();
    }


    async function get_profile() {
        const input1 = document.getElementById("user_name")
        const user_name = input1.value
        const input2 = document.getElementById("user_pass")
        const user_pass = input2.value
        const response = await fetch("/api/get_profile", {
            method: "POST",
            headers: {'Content-Type': 'application/json'},  // так как мы шлём json, нужно явно это показать
            body: JSON.stringify({
                name: user_name,
                passw: user_pass,
            }),
        })
        const user = await response.json()
        console.log(user)
        localStorage.setItem("user", JSON.stringify({
                id: user.id,
                name: user.name,
                passw: user.passw,
            }))
    }

    document.getElementById("reg").onclick = create_user
    document.getElementById("aft").onclick = get_profile


    </script>
</head>
<body>
</body>
</html>
