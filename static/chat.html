<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Socket.IO Chat</title>
    <style>
        #messages { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; }
        .my-message { color: blue; text-align: right; background: #e3f2fd; margin: 5px; padding: 5px; border-radius: 10px; }
        .other-message { color: black; text-align: left; background: #f5f5f5; margin: 5px; padding: 5px; border-radius: 10px; }
    </style>
   <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <h1>Общий чат</h1>

    <!-- Список сообщений -->
    <ul id="messages"></ul>

    <input id="message" placeholder="message">
    <button id="send">send</button>
    <!-- Клиентская библиотека Socket.IO -->

    <script>
        // Подключаемся к серверу Socket.IO.
        // Так как фронт и бэк на одном адресе, URL указываем свой.
        const messagesList = document.getElementById("messages");
        const socket = io("localhost:5000", {transports: ['websocket']});
        const sendButton = document.getElementById("send");
        const input = document.getElementById("message")

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = '/static/index.html';
        }

        // Показать сообщение
        function showMessage(name, text, isMe) {
            const item = document.createElement("li");
            item.className = isMe ? "my-message" : "other-message";
            item.innerHTML = `<strong>${isMe ? 'Я' : name}:</strong> ${text}`;
            messagesList.appendChild(item);
            messagesList.scrollTop = messagesList.scrollHeight;//перелистнуть вниз
        }


        function sendMessage() {
            const text = input.value.trim();

            if (text !== "") {
                // Отправляем сообщение на сервер.
                socket.emit("chat message", {
                    user_id: getCurrentUserId(),
                    message: text

                });

                // Очищаем поле ввода.
                input.value = "";
            }
        }

        // Отправка по кнопке.
        sendButton.addEventListener("click", sendMessage);

        // Получаем сообщение от сервера.
        socket.on("chat message", (msg) => {
        const myId = getCurrentUserId();
        const isMe = msg.user_id === myId;
        showMessage(msg.user_name, msg.message, isMe);
        });
        function getCurrentUserId() {
        const userStr = localStorage.getItem('user')
        if (!userStr) {
            console.error('Пользователь не авторизован')
            window.location.href = '/index.html' // Перенаправляем на авторизацию
            return null
        }

        const user = JSON.parse(userStr)
        return user.id
        }

        input.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };


        // Функция загрузки всех сообщений
    async function loadMessages() {
    try {
        const response = await fetch("/api/get_messages");
        const messages = await response.json();
        console.log(messages);

        messagesList.innerHTML = '';

        messages.forEach(msg => {
            const isMe = msg.user_id === user.id;
            // Используем msg.user_name из БД
            showMessage(msg.user_name, msg.message, isMe);
        });
    } catch (error) {
        console.error("Ошибка загрузки сообщений:", error);
    }
}

    // Загружаем сообщения при подключении
    socket.on("connect", () => {
        loadMessages();
    });
    </script>
</body>
</html>
