<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swift | Добро пожаловать</title>
</head>
<body>

<h1>Вход в аккаунт</h1>

<p><input id="userName" placeholder="Имя пользователя"><br></p>
<p><input id="userPass" placeholder="Пароль"><br></p>
<button id="logBtn">Войти</button> <br><br>
<button id="newUsBtn">Создать аккаунт</button>





<script>
    async function add_user() {
        const input1 = document.getElementById("userName")
        const userName = input1.value

        const input2 = document.getElementById("userPass")
        const userPass = input2.value

        await fetch("/api/add_user", {
		    method: "POST",
		    headers: {'Content-Type': 'application/json'},  // так как мы шлём json, нужно явно это показать

            body: JSON.stringify({
                userName: userName,
                userPass: userPass
            }),
        })

        location.reload();
    }


    document.getElementById("newUsBtn").onclick = add_user
</script>
</body>
</html>
